<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fittings_shop</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131313; /* Глубокий кофейно-черный */
            color: #EAEAEA;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-y: auto;
            /* Нативный плавный скролл на мобильных устройствах */
            -webkit-overflow-scrolling: touch; 
        }

        /* Аппаратное ускорение для карточек товаров, убирающее дерганье при скролле */
        .smooth-gpu-card {
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #131313;
        }
        ::-webkit-scrollbar-thumb {
            background: #313131;
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-4 min-h-screen max-w-md mx-auto flex flex-col justify-between">
    
    <!-- Экран предзагрузки (Preloader) -->
    <div id="preloader" class="fixed inset-0 bg-[#131313] z-50 flex flex-col items-center justify-center transition-opacity duration-500 ease-out">
        <div class="text-[#C67C4E] text-4xl animate-pulse mb-3">⚡</div>
        <p class="text-xs text-zinc-500 uppercase tracking-widest animate-pulse">Загрузка Fittings_shop...</p>
    </div>

    <!-- Шапка бренда -->
    <header class="mb-8 mt-4 text-center">
        <h1 class="text-2xl font-bold tracking-tight text-white">Fittings_shop</h1>
    </header>

    <!-- Сетка товаров -->
    <main id="products-grid" class="grid grid-cols-2 gap-4 mb-8">
        <!-- Генерируется динамически через app.js -->
    </main>

    <!-- Блок оформления заказа (эффект матового стекла на одном крупном статичном элементе работает отлично) -->
    <section class="bg-[#1C1C1E]/75 backdrop-blur-xl rounded-[28px] p-5 border border-zinc-800/40 shadow-[0_24px_60px_rgba(0,0,0,0.35)] smooth-gpu-card">
        <h2 class="text-base font-bold text-white tracking-wide mb-4">Ваш заказ</h2>
        
        <!-- Контейнер корзины -->
        <div id="cart-summary" class="space-y-3 mb-6 max-h-64 overflow-y-auto pr-1">
            <!-- Сюда вставляются плашки товаров -->
        </div>
        
        <!-- Поле ввода города -->
        <div class="mb-4">
            <label class="block text-[11px] font-bold text-[#C67C4E] uppercase tracking-wider mb-2" for="city">
                Город доставки
            </label>
            <input type="text" id="city" placeholder="Например: Москва" 
                   class="w-full bg-[#131313]/60 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-[#C67C4E] transition duration-200">
            
            <!-- Информационная плашка -->
            <div class="flex items-start space-x-2.5 bg-[#C67C4E]/10 border border-[#C67C4E]/20 rounded-xl p-3 mt-3">
                <span class="text-[#C67C4E] text-xs">ℹ️</span>
                <p class="text-[11px] leading-relaxed text-zinc-400">
                    Служба и стоимость доставки обсуждаются отдельно с менеджером после подтверждения.
                </p>
            </div>
        </div>

        <!-- Итоговая стоимость -->
        <div class="flex justify-between items-center mb-6 pt-4 border-t border-zinc-800/60">
            <span class="text-sm font-medium text-zinc-400">Итого к оплате:</span>
            <span id="total-price" class="text-2xl font-bold text-[#C67C4E]">0 ₽</span>
        </div>

        <!-- Кнопка оформления -->
        <button id="submit-order-btn" 
                class="w-full bg-[#C67C4E] text-white py-4 rounded-xl font-semibold hover:bg-[#b06a40] active:scale-[0.98] transition-all duration-150 text-xs tracking-wider uppercase shadow-[0_4px_24px_rgba(198,124,78,0.2)]">
            Оформить заказ
        </button>
    </section>

    <script src="app.js"></script>
</body>
</html>
